[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trave"
version = "1.0.0"
description = "Trave: tables of named, typed columns packed for an app to read with nothing but a gzip decoder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "edde746" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/edde746/trave"

[tool.setuptools]
py-modules = ["trave"]
