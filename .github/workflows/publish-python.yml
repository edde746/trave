name: publish-python

# Publishes python/ to PyPI when a tag python/v<version> is pushed, through PyPI's trusted publishing (its publisher
# is this repository, this workflow and the environment pypi). The tag's version must be pyproject.toml's.
on:
  push:
    tags:
      - "python/v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag against pyproject.toml
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [[ "python/v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: uv run --no-project python -m unittest discover -v tests
      - run: uv build -o ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write # PyPI's trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
